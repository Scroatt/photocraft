# Web bundle for the mobile fork: the same static site photocraft's release job produces, so the
# Android WebView app (Scroatt/PhotoCraft-Mobilr) can ship it without building Rust on a phone.
#
# Triggers on every push (any branch but `ci-logs`) and on demand. The artifact `web-mobile` holds
# photocraft-web-<version>.zip: index.html, the wasm and the JS glue, with relative paths so it
# works from file:// , any sub-path and inside an <iframe>.
#
# The `Publish the build log` step is diagnostic: the Actions log API is blocked in the environment
# this fork is driven from, so a failed build pushes its full output to the `ci-logs` branch,
# which is excluded from the triggers. Remove it once the build is routine.
name: web-mobile

on:
  push:
    branches-ignore: [ci-logs]
  workflow_dispatch:

permissions:
  contents: write

# A new push to the same branch cancels the run already going: only the newest build matters.
concurrency:
  group: web-mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  web:
    name: build web bundle
    runs-on: ubuntu-latest
    env:
      TRUNK_VERSION: 0.21.14
      LOG: ${{ runner.temp }}/web-build.log
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: web-mobile
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # Pinned: a trunk upgrade can change the emitted index.html/glue (see packaging/web/README.md).
      - name: Install trunk
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin" trunk
          trunk --version

      # Disk space is the usual surprise on a cold wasm build; record it before starting.
      - name: Build environment
        run: |
          {
            echo "== $(date -u +%FT%TZ) run ${GITHUB_RUN_NUMBER} of ${GITHUB_REPOSITORY} @ ${GITHUB_SHA}"
            echo "== rustc / cargo / trunk"
            rustc -vV
            cargo --version
            trunk --version
            echo "== installed targets"
            rustup target list --installed
            echo "== disk"
            df -h /
            echo "== tools"
            for tool in zip curl git; do command -v "$tool" || echo "MISSING: $tool"; done
          } 2>&1 | tee "$RUNNER_TEMP/build-env.txt"

      - name: Build and zip
        id: build
        run: |
          set -uo pipefail
          : >"$LOG"
          if packaging/web/package.sh >>"$LOG" 2>&1; then
            tail -n 5 "$LOG"
          else
            code=$?
            echo "::error::packaging/web/package.sh failed with exit code $code; last 300 lines:"
            tail -n 300 "$LOG"
            exit "$code"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: web-mobile
          path: dist/release/*
          if-no-files-found: error

      - name: Publish the build log
        if: failure() && steps.build.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/ci-logs"
          rm -rf "$work"
          mkdir -p "$work/runs/${GITHUB_RUN_NUMBER}"
          git init -q -b ci-logs "$work"
          cd "$work"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$LOG" "runs/${GITHUB_RUN_NUMBER}/web-build.log"
          cp "$RUNNER_TEMP/build-env.txt" "runs/${GITHUB_RUN_NUMBER}/build-env.txt"
          git add -A
          git commit -q -m "web-mobile build log: run ${GITHUB_RUN_NUMBER} (${GITHUB_SHA})"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-logs
